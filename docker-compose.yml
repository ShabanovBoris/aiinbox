services:
  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: sqlite+aiosqlite:////data/app.db
      BACKUP_DIR: /backups
      EXPORT_DIR: /exports
      TEMP_DIR: /tmp/aiinbox
    volumes:
      - aiinbox_data:/data
      - aiinbox_backups:/backups
      - aiinbox_exports:/exports
    tmpfs:
      - /tmp/aiinbox:mode=1777
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-m", "app.ops", "health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  aiinbox_data:
  aiinbox_backups:
  aiinbox_exports:
