[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "personal-ai-inbox"
version = "0.1.0"
description = "Personal AI Inbox — Telegram-driven personal attention manager"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.13",
    "httpx>=0.27",
    "openai>=1.40",
    "pypdf>=6.6,<7",
    "python-docx>=1.1.2,<2",
    "trafilatura>=1.12",
    "yt-dlp>=2024.8",
    "sqlalchemy[asyncio]>=2.0.30",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "pydantic-settings>=2.3",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Контрактные .md не форматируются: PRODUCT_SPEC должен оставаться байт-в-байт копией ТЗ.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
"migrations/*" = ["E501", "I001"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
